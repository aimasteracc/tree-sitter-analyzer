# Composite System Setup Action
#
# Purpose: Consistent system dependency installation across all workflows
# Installs: fd and ripgrep on Linux, macOS, and Windows
# Creates: Symlink for fdfind → fd on Ubuntu

name: 'Setup System Dependencies'
description: 'Install fd and ripgrep system dependencies for all platforms'

inputs:
  os:
    description: 'Operating system (ubuntu-latest, windows-latest, macos-latest)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install system dependencies (Linux)
      if: inputs.os == 'ubuntu-latest'
      run: |
        echo "Installing fd and ripgrep on Linux..."

        # archive.ubuntu.com intermittently stalls without ever failing, which
        # burned the entire 20-minute job timeout before a single test ran and
        # cancelled every ubuntu axis (observed 5/5 attempts on 2026-08-19, and
        # on develop's own run in the same window). A bare `apt-get update` has
        # no wall-clock bound of its own, so bound it here.
        #
        # Deliberately NOT done: raising the job timeout or continue-on-error.
        # Both would hide the hang instead of surviving it. This fails loudly
        # after a bounded number of bounded attempts.
        apt_with_timeout() {
          local what="$1"; shift
          local attempt
          for attempt in 1 2 3; do
            if timeout 180 "$@"; then
              return 0
            fi
            echo "::warning::${what} attempt ${attempt}/3 timed out or failed; retrying"
            sleep $(( attempt * 5 ))
          done
          echo "::error::${what} failed after 3 bounded attempts"
          return 1
        }

        # -o Acquire::Retries makes apt itself retry a stalled mirror connection,
        # and the timeouts stop a single hung socket from consuming the attempt.
        apt_with_timeout "apt-get update" sudo apt-get update           -o Acquire::Retries=3           -o Acquire::http::Timeout=30           -o Acquire::https::Timeout=30
        apt_with_timeout "apt-get install" sudo apt-get install -y fd-find ripgrep

        # Create symlink for fd command (Ubuntu packages it as fdfind)
        sudo ln -sf /usr/bin/fdfind /usr/bin/fd

        # Verify installation
        echo "Verifying installation..."
        fd --version || { echo "❌ fd installation failed"; exit 1; }
        rg --version || { echo "❌ ripgrep installation failed"; exit 1; }
        echo "✅ System dependencies installed successfully on Linux"
      shell: bash

    - name: Install system dependencies (macOS)
      if: startsWith(inputs.os, 'macos-')
      run: |
        echo "Installing fd and ripgrep on macOS..."
        brew install fd ripgrep

        # Verify installation
        echo "Verifying installation..."
        fd --version || { echo "❌ fd installation failed"; exit 1; }
        rg --version || { echo "❌ ripgrep installation failed"; exit 1; }
        echo "✅ System dependencies installed successfully on macOS"
      shell: bash

    - name: Install system dependencies (Windows)
      if: inputs.os == 'windows-latest'
      run: |
        Write-Host "Installing fd and ripgrep on Windows..."
        # NOTE: keep this block ASCII-only. The runner's `powershell`
        # (Windows PowerShell 5.1) reads the inline script as cp1252,
        # so UTF-8 emoji from this YAML get mojibake'd into
        # `Write-Host "<garbage>"` and trip
        # TerminatorExpectedAtEndOfString. scripts/check_ps_ascii.py
        # enforces this at pre-commit time. See
        # docs/POSTMORTEM_v1.13.md sec 5. Switching to `shell: pwsh`
        # (PowerShell Core, UTF-8 by default) is the long-term fix,
        # but the default Windows runner shell is `powershell`.
        #
        # 2026-06-10: download pinned binaries straight from GitHub
        # Releases instead of `choco install`. The chocolatey community
        # feed returned 503/504 for fd/ripgrep across retries and blocked
        # the v1.22.0 release gate on all three Windows axes. GitHub
        # Releases shares availability with the runner itself, the
        # versions are pinned (deterministic), and no Machine-PATH
        # refresh dance is needed.
        $tools = "$env:RUNNER_TEMP\tsa-tools"
        New-Item -ItemType Directory -Force -Path $tools | Out-Null

        $fdVer = "10.2.0"
        $fdZip = "$env:RUNNER_TEMP\fd.zip"
        $fdUrl = "https://github.com/sharkdp/fd/releases/download/v$fdVer/fd-v$fdVer-x86_64-pc-windows-msvc.zip"
        Invoke-WebRequest -Uri $fdUrl -OutFile $fdZip -UseBasicParsing
        if ($LASTEXITCODE -ne 0 -and -not (Test-Path $fdZip)) { Write-Host "::error::fd download failed"; exit 1 }
        Expand-Archive -Path $fdZip -DestinationPath $tools -Force
        Copy-Item "$tools\fd-v$fdVer-x86_64-pc-windows-msvc\fd.exe" "$tools\fd.exe" -Force

        $rgVer = "14.1.1"
        $rgZip = "$env:RUNNER_TEMP\rg.zip"
        $rgUrl = "https://github.com/BurntSushi/ripgrep/releases/download/$rgVer/ripgrep-$rgVer-x86_64-pc-windows-msvc.zip"
        Invoke-WebRequest -Uri $rgUrl -OutFile $rgZip -UseBasicParsing
        if ($LASTEXITCODE -ne 0 -and -not (Test-Path $rgZip)) { Write-Host "::error::ripgrep download failed"; exit 1 }
        Expand-Archive -Path $rgZip -DestinationPath $tools -Force
        Copy-Item "$tools\ripgrep-$rgVer-x86_64-pc-windows-msvc\rg.exe" "$tools\rg.exe" -Force

        # Make the tools visible to this step AND all later steps.
        $env:Path = "$tools;" + $env:Path
        Add-Content -Path $env:GITHUB_PATH -Value $tools

        # Verify installation
        Write-Host "Verifying installation..."
        fd --version
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::fd not found after install"
          exit 1
        }
        rg --version
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::ripgrep not found after install"
          exit 1
        }
        Write-Host "[OK] System dependencies installed successfully on Windows"
      shell: powershell
