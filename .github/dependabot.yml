# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (pip/uv)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    ignore:
      # The build backend is pinned to hatchling==1.31.0 on purpose (#1540,
      # tests/contracts/test_collect_no1_006b_baseline.py): Hatchling 1.32.x
      # emits Core Metadata 2.5, and 1.31.0 is the last release that emits
      # 2.4. A grouped bump (#1823) moves that pin and fails the contract
      # test. This also covers the NO1-006B collector's own hatchling pin in
      # [dependency-groups]; bump both by hand once Metadata 2.5 is accepted
      # by every consumer of the built artifacts.
      - dependency-name: "hatchling"
    groups:
      # Group minor and patch updates to reduce PR noise
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # Group all action updates together
      actions:
        patterns:
          - "*"
