name: Reusable Native Outdated uv Qualification
on:
  workflow_call:
    inputs:
      wheel-name: {required: true, type: string}
jobs:
  outdated-axis:
    name: Outdated uv ${{ matrix.axis }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions: {contents: read, id-token: none, attestations: none}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {axis: linux, runner: ubuntu-24.04}
          - {axis: macos, runner: macos-14}
          - {axis: windows, runner: windows-2022}
    steps:
      - name: Create failure-retained placeholder
        shell: pwsh
        run: New-Item -ItemType Directory -Force outdated-artifacts,fixtures | Out-Null; '{"status":"started"}' | Set-Content -Encoding ascii outdated-artifacts/job-result.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with: {python-version: "3.10"}
      - name: Install qualification driver dependencies
        run: python -m pip install --disable-pip-version-check "psutil>=5,<8" "packaging>=23,<27"
      - name: Fetch exact allowlisted official old archive
        run: python scripts/qualify_outdated_uv.py fetch --axis ${{ matrix.axis }} --version 0.10.9 --output fixtures/old.archive
      - name: Fetch exact allowlisted official supported archive
        if: matrix.axis != 'windows'
        run: python scripts/qualify_outdated_uv.py fetch --axis ${{ matrix.axis }} --version 0.11.0 --output fixtures/supported.archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "native-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: package/build}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "native-aggregate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: package/aggregate}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "native-${{ matrix.axis }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: "package/${{ matrix.axis }}"}
      - name: Prove content-bound manual remediation and exact-wheel MCP causality
        shell: pwsh
        run: >-
          python scripts/qualify_outdated_uv.py axis --axis ${{ matrix.axis }}
          --old-archive fixtures/old.archive --supported-archive fixtures/supported.archive
          --installer install.sh --wheel "package/build/${{ inputs.wheel-name }}"
          --wheel-manifest package/build/wheel-manifest.json
          --package-aggregate package/aggregate/aggregate.json
          --package-report "package/${{ matrix.axis }}/report.json"
          --output outdated-artifacts/report.json
      - name: Write job result
        if: always()
        shell: pwsh
        run: New-Item -ItemType Directory -Force outdated-artifacts | Out-Null; $value=@{job='outdated-axis';axis='${{ matrix.axis }}';status='${{ job.status }}'}|ConvertTo-Json -Compress; $value|Set-Content -Encoding ascii outdated-artifacts/job-result.json
      - name: Upload exact evidence closure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outdated-uv-${{ matrix.axis }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: outdated-artifacts/
          if-no-files-found: error
          retention-days: 90
  outdated-aggregate:
    name: Aggregate outdated uv axes
    if: always()
    needs: outdated-axis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, id-token: none, attestations: none}
    steps:
      - run: mkdir -p outdated-aggregate && printf '{"status":"started"}\n' > outdated-aggregate/job-result.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with: {python-version: "3.10"}
      - name: Install aggregate driver dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5" "psutil>=5,<8"
      - name: Download all exact axes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "outdated-uv-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: downloaded}
      - name: Aggregate evidence
        run: >-
          python scripts/qualify_outdated_uv.py aggregate
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && '--trusted' || '' }}
          --reports downloaded/outdated-uv-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/report.json
          downloaded/outdated-uv-macos-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/report.json
          downloaded/outdated-uv-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}/report.json
          --output outdated-aggregate/aggregate.json
      - if: always()
        run: mkdir -p outdated-aggregate && printf '{"job":"outdated-aggregate","status":"%s"}\n' '${{ job.status }}' > outdated-aggregate/job-result.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outdated-uv-aggregate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: outdated-aggregate/
          if-no-files-found: error
          retention-days: 90
