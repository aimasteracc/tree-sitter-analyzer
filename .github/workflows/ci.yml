# CI Workflow
# Purpose: Continuous Integration for all branches
# High-level coordinator using reusable workflows

name: CI

on:
  push:
    branches: [ main, develop, hotfix/*, release/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      full-validation:
        description: 'Run the full test matrix and connected CI checks without publishing'
        required: false
        default: false
        type: boolean

concurrency:
  # 手动验证固定事件 SHA，后续推送和其他手动验证不能取消它。
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route CI
    runs-on: ubuntu-latest
    outputs:
      run_quality: ${{ steps.route.outputs.run_quality }}
      run_test_matrix: ${{ steps.route.outputs.run_test_matrix }}
      run_build: ${{ steps.route.outputs.run_build }}
      run_docs_check: ${{ steps.route.outputs.run_docs_check }}
      run_e2e_smoke: ${{ steps.route.outputs.run_e2e_smoke }}
      run_regression: ${{ steps.route.outputs.run_regression }}
      regression_scope: ${{ steps.route.outputs.regression_scope }}
      run_sql_platform_compat: ${{ steps.route.outputs.run_sql_platform_compat }}
      full_suite_required: ${{ steps.route.outputs.full_suite_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect changed files
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # 事件中的 base SHA 可能落后于合并提交的实际第一父提交。
            git diff --name-only "${{ github.sha }}^1" "${{ github.sha }}" > changed-files.txt
          elif [[ "${{ github.event.before || '' }}" != "" && "${{ github.event.before || '' }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed-files.txt
          fi
          cat changed-files.txt
        shell: bash

      - name: Route jobs
        id: route
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full-validation && 'true' || 'false' }}
        run: |
          args=()
          if [[ "$FORCE_FULL" == "true" ]]; then
            args+=(--force-full)
          fi
          python3 scripts/ci_route.py --files changed-files.txt --github-output "$GITHUB_OUTPUT" "${args[@]}"
        shell: bash

  docs-check:
    name: Docs Check
    needs: route
    if: needs.route.outputs.run_docs_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          # Contract tests resolve reviewed historical subjects and create
          # non-shallow fresh clones; the default one-commit checkout cannot.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install (all extras)
        run: uv sync --all-extras
      # Docs-only change: skip the heavy matrix, but still run EVERY doc-anchor
      # contract — the split contract/governance suites guard README counts AND the
      # AGENTS.md / GITFLOW.md / CLAUDE.md anchors (deleting the GitFlow link
      # from AGENTS.md must still fail), plus the README structure test. These
      # are fast file-read assertions, so a prose edit is validated against all
      # documented contracts without the Win/macOS matrix.
      - name: Doc contract + structure guard
        run: |
          uv run pytest -q \
            tests/contracts/ \
            tests/governance/ \
            tests/unit/test_claim_registry.py \
            tests/integration/docs/test_readme_structure.py

  quality-check:
    name: Code Quality
    needs: route
    if: needs.route.outputs.run_quality == 'true'
    uses: ./.github/workflows/reusable-quality.yml
    secrets: inherit  # pragma: allowlist secret

  test:
    name: Test Suite
    needs: [route, quality-check]
    if: needs.route.outputs.run_test_matrix == 'true'
    uses: ./.github/workflows/reusable-test.yml
    with:
      matrix-profile: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    secrets: inherit  # pragma: allowlist secret

  build:
    name: Build Verification
    needs: [route, test]
    if: needs.route.outputs.run_build == 'true'
    uses: ./.github/workflows/reusable-build.yml

  e2e:
    name: E2E Tests (MCP black-box)
    needs: [route, quality-check]
    if: needs.route.outputs.run_e2e_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Setup System Dependencies
        uses: ./.github/actions/setup-system
        with:
          os: ubuntu-latest

      - name: Install dependencies
        run: uv sync --all-extras
        shell: bash

      - name: Run E2E smoke tests
        run: |
          uv run pytest tests/e2e/ -m e2e \
            --override-ini="addopts=--strict-markers --verbose --tb=short" \
            --timeout=60 -v > e2e-output.txt 2>&1 || touch e2e_failed
          cat e2e-output.txt
          {
            echo "### E2E Test Results"
            echo '```text'
            tail -n 25 e2e-output.txt
            echo '```'
            if [ -f e2e_failed ]; then
              echo "E2E tests failed — see above for server stderr output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f e2e_failed ]; then
            exit 1
          fi
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

  regression:
    name: Regression Tests
    needs: [route, test]
    if: needs.route.outputs.run_regression == 'true'
    uses: ./.github/workflows/regression-tests.yml
    with:
      test-scope: ${{ needs.route.outputs.regression_scope }}

  sql-platform-compat:
    name: SQL Platform Compatibility
    needs: [route, test]
    if: needs.route.outputs.run_sql_platform_compat == 'true'
    uses: ./.github/workflows/sql-platform-compat.yml

  test-quality-audit:
    name: Test Quality Audit
    needs: [route, test]
    if: needs.route.outputs.run_test_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run test quality audit
        run: |
          mkdir -p reports
          uv run python scripts/audit_test_quality.py --strict --output reports/test-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-audit-report
          path: reports/test-audit.json
          retention-days: 30

  quality-gate:
    name: Quality Gate
    needs: [route, docs-check, test, quality-check, build, e2e, regression, sql-platform-compat, test-quality-audit]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_required_gate.py
          sparse-checkout-cone-mode: false
      # Fail-closed: the required lanes are derived from the route job's own
      # outputs. A selected lane must end ``success`` -- ``skipped``,
      # ``cancelled`` or missing fails the gate; only an unselected lane may be
      # skipped. Mapping and rules: scripts/ci_required_gate.py.
      - name: Require every selected lane to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_required_gate.py
