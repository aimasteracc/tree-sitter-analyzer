name: SQL Platform Compatibility

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-compatibility:
    name: Test Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs as ONE job below (all four Pythons sequentially): macOS arm64
        # runners are capacity-constrained and each version needs ~30 s of work.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run Platform Compatibility Tests
      run: |
        # Run SQL-specific tests from unit/languages directory
        uv run python -m pytest tests/unit/languages/ -k "test_sql" -v --tb=short

    - name: Dump AST for Sample Database
      run: |
        uv run python scripts/dump_ast.py examples/sample_database.sql > sample_database_ast.txt

    - name: Upload AST Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ast-dump-${{ matrix.os }}-${{ matrix.python-version }}
        path: sample_database_ast.txt

    - name: Record SQL Behavior Profile
      run: |
        uv run python -m tree_sitter_analyzer.platform_compat.record --output-dir tests/platform_profiles

    - name: Upload Profile Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: profile-${{ matrix.os }}-${{ matrix.python-version }}
        path: tests/platform_profiles/

    - name: Compare with Baseline
      shell: python
      run: |
        import sys
        import os
        import platform
        from pathlib import Path
        import subprocess

        # Detect current platform key (same logic as detector)
        os_name = platform.system().lower()
        if os_name == "darwin": os_name = "macos"
        python_version = f"{sys.version_info.major}.{sys.version_info.minor}"

        # Paths
        base_dir = Path("tests/platform_profiles")
        current_profile = base_dir / os_name / python_version / "profile.json"
        baseline_profile = base_dir / "baseline" / os_name / python_version / "profile.json"

        if not current_profile.exists():
            print(f"Error: Generated profile not found at {current_profile}")
            sys.exit(1)

        if not baseline_profile.exists():
            print(f"No baseline found at {baseline_profile}. Skipping comparison.")
            sys.exit(0)

        print(f"Comparing {current_profile} with {baseline_profile}...")
        # Use uv run to ensure dependencies are available
        result = subprocess.run(
            ["uv", "run", "python", "-m", "tree_sitter_analyzer.platform_compat.compare", str(baseline_profile), str(current_profile), "--fail-on-diff"],
            capture_output=True,
            text=True
        )

        print(result.stdout)
        print(result.stderr)

        if result.returncode != 0:
            sys.exit(result.returncode)

  test-compatibility-macos:
    # One macOS runner for every supported Python (3.10-3.13) instead of four
    # runners that each do ~30 s of work. A version failure does not stop the
    # remaining versions; the job fails at the end if any version failed.
    name: Test Compatibility (macos-latest, Python 3.10-3.13)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOS_PYTHON_VERSIONS: "3.10 3.11 3.12 3.13"
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Run SQL compatibility for each Python version
      shell: bash
      run: |
        set -uo pipefail
        failed=""
        mkdir -p macos-artifacts
        for v in $MACOS_PYTHON_VERSIONS; do
          echo "::group::macOS SQL compatibility, Python $v"
          (
            set -euo pipefail
            export UV_PROJECT_ENVIRONMENT=".venv-$v"
            uv python install "$v"
            uv sync --python "$v" --all-extras --dev
            uv run --python "$v" python -m pytest tests/unit/languages/ -k "test_sql" -v --tb=short
            uv run --python "$v" python scripts/dump_ast.py examples/sample_database.sql > "macos-artifacts/sample_database_ast_$v.txt"
            uv run --python "$v" python -m tree_sitter_analyzer.platform_compat.record --output-dir tests/platform_profiles
            current="tests/platform_profiles/macos/$v/profile.json"
            baseline="tests/platform_profiles/baseline/macos/$v/profile.json"
            if [ ! -f "$current" ]; then
              echo "Error: Generated profile not found at $current"
              exit 1
            fi
            if [ -f "$baseline" ]; then
              echo "Comparing $current with $baseline..."
              uv run --python "$v" python -m tree_sitter_analyzer.platform_compat.compare "$baseline" "$current" --fail-on-diff
            else
              echo "No baseline found at $baseline. Skipping comparison."
            fi
          )
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -eq 0 ]; then
            echo "RESULT macOS Python $v: PASS"
          else
            echo "::error::RESULT macOS Python $v: FAIL (exit $rc)"
            failed="$failed $v"
          fi
        done
        if [ -n "$failed" ]; then
          echo "macOS SQL compatibility failed for Python:$failed"
          exit 1
        fi
        echo "macOS SQL compatibility passed for all of: $MACOS_PYTHON_VERSIONS"

    - name: Upload AST Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ast-dump-macos-latest
        path: macos-artifacts/
        if-no-files-found: ignore

    - name: Upload Profile Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: profile-macos-latest
        path: tests/platform_profiles/macos/
        if-no-files-found: ignore
