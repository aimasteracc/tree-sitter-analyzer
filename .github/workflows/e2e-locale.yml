# E2E Locale Matrix
#
# Regression guard for the cp932/cp936/cp949 UnicodeDecodeError bug (PR #153).
# The main CI matrix forces PYTHONUTF8=1; this workflow deliberately tests
# without that safety net to catch subprocess decoding regressions when the
# host locale is not UTF-8.
#
# Runs on:
#   - push to main / develop (post-merge verification)
#   - pull requests that touch tree_sitter_analyzer/** or tests/e2e/**
#   - weekly schedule (catches regressions from indirect dependency changes)
#   - manual trigger

name: E2E Locale Matrix

on:
  push:
    branches: [main, develop]
    paths:
      - "tree_sitter_analyzer/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-locale.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tree_sitter_analyzer/**"
      - "tests/e2e/**"
  schedule:
    # Weekly on Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-locale:
    name: E2E (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Japanese — cp932 is the Windows codepage; Linux approximation
          - locale: ja_JP.eucjp
            lang: ja_JP.EUC-JP
            encoding: euc-jp
          # Simplified Chinese — cp936 / GBK
          - locale: zh_CN.gbk
            lang: zh_CN.GBK
            encoding: gbk
          # Korean — cp949 / EUC-KR
          - locale: ko_KR.euckr
            lang: ko_KR.EUC-KR
            encoding: euc-kr

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locale packages
        # Network-free first: the runner image ships the `locales` package
        # (glibc locale sources + charmaps), so `locale-gen` can compile the
        # locale offline. apt is only a fallback (with retries), because the
        # Ubuntu mirrors are intermittently unresolvable from runners and
        # `locales-all` (a ~11 MB download) is not needed.
        run: |
          set -u
          LANG_NAME="${{ matrix.lang }}"
          LOCALE_NAME="${{ matrix.locale }}"

          locale_ready() {
            locale -a | grep -qix "$LOCALE_NAME" || locale -a | grep -qix "$LANG_NAME"
          }

          if ! locale_ready; then
            charset="${LANG_NAME#*.}"
            echo "Generating ${LANG_NAME} offline with locale-gen"
            sudo locale-gen "${LANG_NAME}" || true
            # Fall back to a direct localedef if locale-gen did not register it
            if ! locale_ready; then
              sudo localedef -i "${LANG_NAME%%.*}" -f "${charset}" "${LANG_NAME}" || true
            fi
          fi

          if ! locale_ready; then
            echo "::warning::Offline generation failed; falling back to apt (with retries)"
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 update -q || true
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 install -y locales locales-all || true
            sudo locale-gen "${LANG_NAME}" || true
          fi

          # Hard assertion: the E2E tests must run under the real locale.
          if ! locale_ready; then
            echo "::error::Locale ${LANG_NAME} (${LOCALE_NAME}) is not available; refusing to run E2E tests under a different locale."
            locale -a
            exit 1
          fi
          sudo update-locale LANG="${LANG_NAME}" || true
          LC_ALL="${LANG_NAME}" locale charmap
          LC_ALL="${LANG_NAME}" python3 -c "import locale; locale.setlocale(locale.LC_ALL, ''); print('locale OK:', locale.getlocale(), locale.getpreferredencoding(False))"

      - name: Setup System Dependencies
        uses: ./.github/actions/setup-system
        with:
          os: ubuntu-latest

      - name: Install dependencies
        run: uv sync --all-extras
        shell: bash

      - name: Run E2E smoke tests under ${{ matrix.locale }}
        run: |
          echo "### E2E Locale: ${{ matrix.locale }}" >> $GITHUB_STEP_SUMMARY
          uv run pytest tests/e2e/ -m e2e \
            --override-ini="addopts=--strict-markers --verbose --tb=short" \
            --timeout=60 --tb=short -v \
            -k "unicode or decode or stderr" > e2e-output.txt 2>&1 || touch e2e_failed
          cat e2e-output.txt
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 20 e2e-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f e2e_failed ]; then
            echo "E2E locale tests failed under ${{ matrix.locale }}." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lang }}
          # Intentionally NOT setting PYTHONUTF8=1 — that's the whole point.
          # We want to observe the encoding behavior under the native locale.
          PYTHONIOENCODING: ${{ matrix.encoding }}
