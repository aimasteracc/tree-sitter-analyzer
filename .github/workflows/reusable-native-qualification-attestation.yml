  tiny-attestation:
    name: Attest only after read-only verification
    needs: read-only-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: {name: "trusted-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: verified}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: {name: "native-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: subjects/build}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: {name: "native-aggregate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: subjects/package}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: {name: "outdated-uv-aggregate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}", path: subjects/outdated}
      - name: Bind receipt to exact subjects
        env: {WHEEL_NAME: "${{ inputs.wheel-name }}"}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest(); r=json.loads(pathlib.Path("verified/receipt.json").read_text())
          assert r["source_commit"]==os.environ["GITHUB_SHA"] and r["run_id"]==os.environ["GITHUB_RUN_ID"] and r["run_attempt"]==os.environ["GITHUB_RUN_ATTEMPT"] and r["automatic_mutable_bootstrap_qualified"] is False
          assert r["wheel"]["sha256"]==sha(pathlib.Path("subjects/build")/os.environ["WHEEL_NAME"])
          assert r["package_aggregate_sha256"]==sha(pathlib.Path("subjects/package/aggregate.json")) and r["outdated_aggregate_sha256"]==sha(pathlib.Path("subjects/outdated/aggregate.json"))
          PY
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with: {subject-path: "subjects/build/${{ inputs.wheel-name }}"}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with: {subject-path: subjects/package/aggregate.json}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with: {subject-path: subjects/outdated/aggregate.json}
